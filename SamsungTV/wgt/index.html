<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>IPTelevision+</title>
<link rel="stylesheet" href="css/style.css">
<script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
<object id="av" type="application/avplayer"></object>
<div id="app">
  <div id="screen"></div>
  <div id="overlay"></div>
  <div id="toast" role="status"></div>
</div>
<script>
  // Browser-Vorschau: 1920 × 1080 auf das Fenster verkleinern. Auf der TV ist das Fenster genau 1920 × 1080.
  (function () { function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); document.getElementById("app").style.transform = s < 0.999 || s > 1.001 ? "scale(" + s + ")" : ""; } window.addEventListener("resize", fit); fit(); })();
</script>
<script src="js/config.local.js" onerror="void 0"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/player.js"></script>
<script src="js/library.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
